<script>
function workCard(w){
  var meta = '';
  if (w[4]) meta += '<dt>塗料</dt><dd>'+w[4]+'</dd>';
  if (w[5]) meta += '<dt>工期</dt><dd>'+w[5]+'</dd>';
  return '<article class="work"><div class="photo"><img loading="lazy" src="'+full(w[6])+'" data-fb="'+img(w[6])+'" onerror="fallback(this)" alt="'+w[1]+' '+w[2]+'の施工写真"></div>'+
    '<span class="area">'+w[1]+'</span><h3>'+w[2]+'</h3><p>'+w[3]+'</p>'+(meta?'<dl>'+meta+'</dl>':'')+'</article>';
}
</script>

<section class="sec">
  <div class="wrap">
    <div class="filter" role="group" aria-label="地域でしぼりこむ">
      <button aria-pressed="true" data-a="all">すべて</button>
      <button aria-pressed="false" data-a="杉並区">杉並区</button>
      <button aria-pressed="false" data-a="世田谷区">世田谷区</button>
      <button aria-pressed="false" data-a="練馬区">練馬区</button>
      <button aria-pressed="false" data-a="中野区">中野区</button>
      <button aria-pressed="false" data-a="三鷹市">三鷹市</button>
      <button aria-pressed="false" data-a="other">そのほかの地域</button>
    </div>
    <p class="count" id="count" aria-live="polite"></p>
    <div class="works" id="all"></div>
  </div>
</section>
<script>
document.addEventListener("DOMContentLoaded",function(){
  var main=["杉並区","世田谷区","練馬区","中野区","三鷹市"];
  function show(a){
    var list=WORKS.filter(function(w){return a==="all"||(a==="other"?main.indexOf(w[1])<0:w[1]===a)});
    document.getElementById("all").innerHTML=list.map(workCard).join("");
    document.getElementById("count").textContent=list.length+"件を表示しています";
  }
  document.querySelectorAll(".filter button").forEach(function(b){
    b.addEventListener("click",function(){
      document.querySelectorAll(".filter button").forEach(function(x){x.setAttribute("aria-pressed","false")});
      b.setAttribute("aria-pressed","true"); show(b.dataset.a);
    });
  });
  show("all");
});
</script>
